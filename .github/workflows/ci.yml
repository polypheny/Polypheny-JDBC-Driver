name: Polypheny JDBC Driver CI

on: [ push, pull_request ]

jobs:
    build-polypheny:
        strategy:
            matrix:
                server:
                    -   name: legacy
                        ref: 5fc744f2596641ddd2eacecf0053f90481238e4d
                    -   name: graph
                        ref: 50a394aedcf172b8f8240a17edf69268289c5082
                    -   name: prism24
                        ref: 01a2e438d761190e889f1a9f91426d3264b3e6d8
        timeout-minutes: 15
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/setup-java@v4
                with:
                    distribution: 'temurin'
                    java-version: '17'

            -   name: Checkout Polypheny
                uses: actions/checkout@v4
                with:
                    repository: polypheny/Polypheny-DB
                    ref: ${{ matrix.server.ref }}

            -   name: Build Polypheny
                run: |
                    ./gradlew :dbms:shadowJar assemblePlugins -PwithoutpullingUi=true --console=plain

            -   name: Package the executable server JAR
                run: |
                    ./gradlew :dbms:shadowJar -PwithoutpullingUi=true
                    python3 - <<'PY'
                    from zipfile import ZipFile
                    with ZipFile('dbms/build/libs/dbms-0.10.1-SNAPSHOT.jar') as jar:
                        assert 'org/polypheny/db/PolyphenyDb.class' in jar.namelist()
                        assert 'com/google/common/collect/ImmutableList.class' in jar.namelist()
                    PY

            -   name: Store Polypheny JAR
                uses: actions/upload-artifact@v4
                with:
                    name: polypheny-jar-${{ matrix.server.name }}
                    path: dbms/build/libs/dbms-0.10.1-SNAPSHOT.jar

    build:
        needs: build-polypheny
        strategy:
            fail-fast: false
            matrix:
                java: [ 8, 11, 17, 21 ]
                os: [ ubuntu-latest, macos-latest ]
                exclude:
                    -   os: macos-latest
                        java: 8
        timeout-minutes: 5
        runs-on: ${{ matrix.os }}
        name: Java ${{ matrix.java }} @ ${{ matrix.os }}
        steps:
            -   uses: actions/checkout@v4
            -   name: Set up JDK
                uses: actions/setup-java@v4
                with:
                    distribution: 'temurin'
                    java-version: |
                        17
                        ${{ matrix.java }}
            -   name: Load Polypheny JAR
                uses: actions/download-artifact@v4
                with:
                    name: polypheny-jar-legacy

            -   name: Build & test with Gradle
                uses: polypheny/GitHub-Action-Run-Polypheny@dev
                with:
                    cmd: ./gradlew build -PdisableToolchain=true -PskipGraphIntegration
                    jar: dbms-0.10.1-SNAPSHOT.jar
                    java: ${{ env.JAVA_HOME_17_X64 || env.JAVA_HOME_17_ARM64 }}/bin/java

    build-windows:
        needs: build-polypheny
        strategy:
            fail-fast: false
        timeout-minutes: 20
        runs-on: windows-latest
        name: Java 8 @ windows-latest
        steps:
            -   uses: actions/checkout@v4
            -   name: Set up JDK
                uses: actions/setup-java@v4
                with:
                    distribution: 'temurin'
                    java-version: |
                        17
                        8
            -   name: Load Polypheny JAR
                uses: actions/download-artifact@v4
                with:
                    name: polypheny-jar-legacy

            -   name: Build & test with Gradle
                uses: polypheny/GitHub-Action-Run-Polypheny@v0.2.0
                with:
                    cmd: gradlew.bat build -PdisableToolchain=true -PskipGraphIntegration
                    jar: dbms-0.10.1-SNAPSHOT.jar
                    java: ${{ env.JAVA_HOME_17_X64 }}\bin\java

    test-stores:
        needs: build-polypheny
        strategy:
            fail-fast: false
            matrix:
                adapter: [ mongodb, hsqldb, monetdb, postgresql, file, neo4j ]
        timeout-minutes: 10
        runs-on: ubuntu-latest
        name: Test on ${{ matrix.adapter }}
        steps:
            -   uses: actions/checkout@v4
            -   name: Set up JDK
                uses: actions/setup-java@v4
                with:
                    distribution: 'temurin'
                    java-version: 17
            -   name: Load Polypheny JAR
                uses: actions/download-artifact@v4
                with:
                    name: polypheny-jar-legacy
            -   name: Build with Gradle
                uses: polypheny/GitHub-Action-Run-Polypheny@v0.2.0
                with:
                    cmd: ./gradlew build -PdisableToolchain=true -PskipGraphIntegration
                    jar: dbms-0.10.1-SNAPSHOT.jar
                    default-store: ${{ matrix.adapter }}

    test-graph:
        needs: build-polypheny
        timeout-minutes: 10
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            -   uses: actions/setup-java@v4
                with:
                    distribution: 'temurin'
                    java-version: 17
            -   uses: actions/download-artifact@v4
                with:
                    name: polypheny-jar-graph
            -   name: Test Prism 2.3 graph queries
                uses: polypheny/GitHub-Action-Run-Polypheny@v0.2.0
                with:
                    cmd: ./gradlew test -PdisableToolchain=true --tests org.polypheny.jdbc.GraphQueryTest
                    jar: dbms-0.10.1-SNAPSHOT.jar

    test-prism24:
        needs: build-polypheny
        timeout-minutes: 10
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            -   uses: actions/setup-java@v4
                with:
                    distribution: 'temurin'
                    java-version: 17
            -   uses: actions/download-artifact@v4
                with:
                    name: polypheny-jar-prism24
            -   name: Test JDBC diagnostics against Prism 2.4
                uses: polypheny/GitHub-Action-Run-Polypheny@v0.2.0
                with:
                    cmd: ./gradlew test -PdisableToolchain=true -Pprism24Integration --tests org.polypheny.jdbc.Prism24IntegrationTest
                    jar: dbms-0.10.1-SNAPSHOT.jar
                    autodocker: 'false'
                    default-store: hsqldb
