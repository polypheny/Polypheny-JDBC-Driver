name: Polypheny JDBC Driver CI

on: [ push, pull_request ]

jobs:
    build-polypheny:
        timeout-minutes: 15
        runs-on: ubuntu-24.04
        steps:
            -   uses: actions/setup-java@v4
                with:
                    distribution: 'temurin'
                    java-version: '17'

            -   name: Checkout Polypheny
                uses: actions/checkout@v4
                with:
                    repository: polypheny/Polypheny-DB
                    # Prism 2.1 server used by the 3.x driver integration tests.
                    ref: 5fc744f2596641ddd2eacecf0053f90481238e4d

            -   name: Build Polypheny
                run: |
                    ./gradlew :dbms:shadowJar assemblePlugins -PwithoutpullingUi=true --console=plain

            -   name: Package the executable server JAR
                run: |
                    ./gradlew :dbms:shadowJar -PwithoutpullingUi=true
                    python3 - <<'PY'
                    from zipfile import ZipFile
                    with ZipFile('dbms/build/libs/dbms-0.10.1-SNAPSHOT.jar') as jar:
                        assert 'org/polypheny/db/PolyphenyDb.class' in jar.namelist()
                        assert 'com/google/common/collect/ImmutableList.class' in jar.namelist()
                    PY

            -   name: Store Polypheny JAR
                uses: actions/upload-artifact@v4
                with:
                    name: polypheny-jar
                    path: dbms/build/libs/dbms-0.10.1-SNAPSHOT.jar

    build:
        needs: build-polypheny
        strategy:
            fail-fast: false
            matrix:
                java: [ 8, 11, 17, 21 ]
                os: [ ubuntu-24.04, macos-latest ]
                exclude:
                    -   os: macos-latest
                        java: 8
        timeout-minutes: 5
        runs-on: ${{ matrix.os }}
        name: Java ${{ matrix.java }} @ ${{ matrix.os == 'ubuntu-24.04' && 'ubuntu-latest' || matrix.os }}
        steps:
            -   uses: actions/checkout@v4
            -   name: Set up JDK
                uses: actions/setup-java@v4
                with:
                    distribution: 'temurin'
                    java-version: |
                        17
                        ${{ matrix.java }}
            -   name: Load Polypheny JAR
                uses: actions/download-artifact@v4
                with:
                    name: polypheny-jar

            -   name: Build & test with Gradle
                uses: polypheny/GitHub-Action-Run-Polypheny@dev
                with:
                    cmd: ./gradlew build -PdisableToolchain=true
                    jar: dbms-0.10.1-SNAPSHOT.jar
                    java: ${{ env.JAVA_HOME_17_X64 || env.JAVA_HOME_17_ARM64 }}/bin/java

    build-windows:
        needs: build-polypheny
        strategy:
            fail-fast: false
        timeout-minutes: 20
        runs-on: windows-latest
        name: Java 8 @ windows-latest
        steps:
            -   uses: actions/checkout@v4
            -   name: Set up JDK
                uses: actions/setup-java@v4
                with:
                    distribution: 'temurin'
                    java-version: |
                        17
                        8
            -   name: Load Polypheny JAR
                uses: actions/download-artifact@v4
                with:
                    name: polypheny-jar

            -   name: Build & test with Gradle
                uses: polypheny/GitHub-Action-Run-Polypheny@v0.2.0
                with:
                    cmd: gradlew.bat build -PdisableToolchain=true
                    jar: dbms-0.10.1-SNAPSHOT.jar
                    java: ${{ env.JAVA_HOME_17_X64 }}\bin\java

    test-stores:
        needs: build-polypheny
        strategy:
            fail-fast: false
            matrix:
                adapter: [ mongodb, hsqldb, monetdb, postgresql, file, neo4j ]
        timeout-minutes: 10
        runs-on: ubuntu-24.04
        name: Test on ${{ matrix.adapter }}
        steps:
            -   uses: actions/checkout@v4
            -   name: Set up JDK
                uses: actions/setup-java@v4
                with:
                    distribution: 'temurin'
                    java-version: 17
            -   name: Load Polypheny JAR
                uses: actions/download-artifact@v4
                with:
                    name: polypheny-jar
            -   name: Build with Gradle
                uses: polypheny/GitHub-Action-Run-Polypheny@v0.2.0
                with:
                    cmd: ./gradlew build -PdisableToolchain=true
                    jar: dbms-0.10.1-SNAPSHOT.jar
                    default-store: ${{ matrix.adapter }}
